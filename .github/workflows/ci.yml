name: CI
on: [push, pull_request]
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run test:crypto
      - run: npm run test:ai
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: sopet
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci -d sopet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults: { run: { working-directory: backend } }
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/sopet
      JWT_ACCESS_SECRET: ci_access_secret_at_least_32_characters
      JWT_REFRESH_SECRET: ci_refresh_secret_at_least_32_characters
      FRONTEND_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm test -- --runInBand
      - run: npm run build
      - run: npm run audit:verify
      - run: npm audit --omit=dev --audit-level=high
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gitleaks/gitleaks-action@v2
